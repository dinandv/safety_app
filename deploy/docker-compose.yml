services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bccsafety
      POSTGRES_USER: bcc_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets:
      - db_owner_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Geen ports: — de database is nooit van buiten bereikbaar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcc_owner -d bccsafety"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # bcc_app, niet bcc_owner. Zonder dat onderscheid staat RLS
      # effectief uit, want een eigenaar omzeilt zijn eigen policies.
      ConnectionStrings__Default: >-
        Host=db;Database=bccsafety;Username=bcc_app;
        Password=${DB_APP_PASSWORD};Multiplexing=false
    expose:
      - "8080"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:

secrets:
  db_owner_password:
    file: ./secrets/db_owner_password
