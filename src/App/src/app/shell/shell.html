<main>
  <router-outlet />
</main>

<nav aria-label="Hoofdnavigatie">
  @for (tab of tabs; track tab.path) {
    <a
      [routerLink]="['/', tab.path]"
      routerLinkActive="active"
      #link="routerLinkActive"
      [attr.aria-current]="link.isActive ? 'page' : null"
    >
      <ui-icon [name]="tab.icon" [size]="20" />
      <span>{{ tab.label }}</span>
    </a>
  }
</nav>
